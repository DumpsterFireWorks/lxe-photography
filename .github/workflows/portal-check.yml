name: Client gallery portal checks

on:
  pull_request:
    paths:
      - "src/**"
      - "studio/**"
      - "client-galleries/**"
      - "**/*.html"
      - "**/*.css"
      - "script.js"
      - "payment-ready.js"
      - "gallery-portal.*"
      - "migrations/**"
      - "tests/**"
      - "wrangler.jsonc"
      - "package.json"
      - "sitemap.xml"
      - ".github/scripts/**"
      - ".github/workflows/portal-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Check JavaScript syntax
        run: npm run check

      - name: Audit static website
        run: npm run audit

      - name: Build Worker bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
