name: Client gallery portal checks

on:
  pull_request:
    paths:
      - "src/**"
      - "studio/**"
      - "gallery-portal.*"
      - "migrations/**"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/portal-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Check JavaScript syntax
        run: npm run check

      - name: Build Worker bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
