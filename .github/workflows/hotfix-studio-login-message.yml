name: Apply Studio login delivery hotfix

on:
  push:
    branches:
      - "hotfix/studio-login-message-shape"
    paths:
      - ".github/workflows/hotfix-studio-login-message.yml"

permissions:
  contents: write

jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/studio-login-message-shape
          fetch-depth: 0

      - name: Patch Studio email payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/gallery-portal.js")
          source = path.read_text(encoding="utf-8")

          old = '''async function sendStudioCode(env, code) {
            await env.EMAIL.send({
              to: PUBLIC_EMAIL,
              from: { email: PUBLIC_EMAIL, name: "LXE Photography Studio" },
              subject: "Your LXE Studio sign-in code",
              text: `Your LXE Photography Studio sign-in code is ${code}. It expires in 10 minutes. If you did not request this code, ignore this email.`,
              html: `<h1>LXE Photography Studio</h1><p>Your sign-in code is:</p><p style="font-size:32px;font-weight:700;letter-spacing:8px">${code}</p><p>This code expires in 10 minutes.</p>`
            });
          }'''

          new = '''async function sendStudioCode(env, code) {
            await env.EMAIL.send({
              to: PUBLIC_EMAIL,
              from: { email: PUBLIC_EMAIL, name: "LXE Photography Website" },
              replyTo: { email: ADMIN_EMAIL, name: "Lexus Erickson" },
              subject: "LXE Photography Studio sign-in code",
              text: [
                "LXE Photography Studio sign-in",
                "",
                `Your six-digit code is ${code}.`,
                "",
                "This code expires in 10 minutes. If you did not request it, ignore this email."
              ].join("\\n"),
              html: `<h1>LXE Photography Studio sign-in</h1><p>Your six-digit code is:</p><p><strong>${code}</strong></p><p>This code expires in 10 minutes. If you did not request it, ignore this email.</p>`
            });
          }'''

          if old not in source:
              raise SystemExit("Expected Studio email function was not found")
          source = source.replace(old, new, 1)

          old_catch = '''  } catch {
              console.error("Studio sign-in email delivery failed.");
              return json({ ok: false, error: "The sign-in code could not be sent. Please try again." }, 502);
            }'''
          new_catch = '''  } catch (error) {
              console.error("Studio sign-in email delivery failed.", error?.code || "UNKNOWN");
              return json({ ok: false, error: "The sign-in code could not be sent. Please try again." }, 502);
            }'''
          if old_catch not in source:
              raise SystemExit("Expected Studio delivery catch block was not found")
          source = source.replace(old_catch, new_catch, 1)

          path.write_text(source, encoding="utf-8")
          PY

      - name: Verify focused payload requirements
        shell: bash
        run: |
          grep -F 'from: { email: PUBLIC_EMAIL, name: "LXE Photography Website" }' src/gallery-portal.js
          grep -F 'replyTo: { email: ADMIN_EMAIL, name: "Lexus Erickson" }' src/gallery-portal.js
          grep -F 'subject: "LXE Photography Studio sign-in code"' src/gallery-portal.js

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Run verification
        run: npm run verify

      - name: Check formatting
        run: git diff --check

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm .github/workflows/hotfix-studio-login-message.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Match Studio login email to working delivery shape"
          git push origin HEAD:hotfix/studio-login-message-shape
