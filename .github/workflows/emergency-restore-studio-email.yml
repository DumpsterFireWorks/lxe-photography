name: Emergency restore Studio email destination

on:
  push:
    branches:
      - "hotfix/studio-email-verified-destination"

permissions:
  contents: write

concurrency:
  group: emergency-restore-studio-email
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified-destination hotfix
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {count}: {old!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace_exact(
              "wrangler.jsonc",
              '"destination_address": "hello@lxephotography.com"',
              '"destination_address": "lynnlexus421@gmail.com"'
          )

          replace_exact(
              "src/gallery-portal.js",
              'async function sendStudioCode(env, code) {\n  await env.EMAIL.send({\n    to: PUBLIC_EMAIL,',
              'async function sendStudioCode(env, code) {\n  await env.EMAIL.send({\n    to: ADMIN_EMAIL,'
          )

          replace_exact(
              "src/worker.js",
              'const PUBLIC_EMAIL = "hello@lxephotography.com";\nconst INQUIRY_DESTINATION = PUBLIC_EMAIL;',
              'const ADMIN_EMAIL = "lynnlexus421@gmail.com";\nconst PUBLIC_EMAIL = "hello@lxephotography.com";\nconst INQUIRY_DESTINATION = ADMIN_EMAIL;'
          )

          replace_exact(
              "tests/studio-login-email.test.js",
              'test("studio login code uses the destination-restricted public inbox", () => {',
              'test("studio login code uses the verified destination inbox", () => {'
          )
          replace_exact(
              "tests/studio-login-email.test.js",
              'assert.match(sendStudioCode, /to: PUBLIC_EMAIL,/);\n  assert.doesNotMatch(sendStudioCode, /to: ADMIN_EMAIL,/);',
              'assert.match(sendStudioCode, /to: ADMIN_EMAIL,/);\n  assert.doesNotMatch(sendStudioCode, /to: PUBLIC_EMAIL,/);'
          )
          replace_exact(
              "tests/studio-login-email.test.js",
              'assert.match(wranglerSource, /"destination_address":\\s*"hello@lxephotography\\.com"/);',
              'assert.match(wranglerSource, /"destination_address":\\s*"lynnlexus421@gmail\\.com"/);'
          )

          inquiry = Path("tests/inquiry.test.js")
          text = inquiry.read_text(encoding="utf-8")
          old_config = 'destination_address: "hello@lxephotography.com"'
          if text.count(old_config) != 1:
              raise SystemExit(f"tests/inquiry.test.js: expected one config destination, found {text.count(old_config)}")
          text = text.replace(old_config, 'destination_address: "lynnlexus421@gmail.com"')
          old_recipient = 'assert.equal(sent.to, "hello@lxephotography.com");'
          count = text.count(old_recipient)
          if count < 2:
              raise SystemExit(f"tests/inquiry.test.js: expected at least two recipient assertions, found {count}")
          text = text.replace(old_recipient, 'assert.equal(sent.to, "lynnlexus421@gmail.com");')
          inquiry.write_text(text, encoding="utf-8")
          PY

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Verify repository
        run: npm run verify

      - name: Check patch formatting
        run: git diff --check

      - name: Remove one-time workflow
        run: rm .github/workflows/emergency-restore-studio-email.yml

      - name: Commit verified hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore verified email destination for Studio login"
          git push origin "HEAD:${GITHUB_REF_NAME}"
